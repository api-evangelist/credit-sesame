name: Credit Sesame
description: >-
  Credit Sesame is a consumer financial health platform that provides free daily
  credit-score monitoring, credit reports, and personalized recommendations for
  credit cards, loans, and insurance based on a member's approval likelihood.
  Members can build credit through everyday debit purchases and upgrade to the
  Sesame+ premium tier for three-bureau credit reports, advanced credit tools,
  and identity-theft protection. Credit Sesame operates consumer web and mobile
  applications and, as of this profile, does not publish a public developer API;
  it is tracked in the API Evangelist network as a company profile backed by
  Menlo Ventures.
